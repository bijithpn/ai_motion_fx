name: thinking_orb
version: 0.2.0
description: >-
  Animated AI status indicators for Flutter, drawn with CustomPainter: nine
  thinking-orb states, image and voice orbs, plus glow effects that wrap your
  own widgets (sound-reactive voice glow, border beam, image reveal loader).
repository: https://github.com/bijithpn/thinking_orb
issue_tracker: https://github.com/bijithpn/thinking_orb/issues
topics:
  - animation
  - ai
  - loading
  - indicator
  - custom-painter

environment:
  sdk: ^3.11.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
